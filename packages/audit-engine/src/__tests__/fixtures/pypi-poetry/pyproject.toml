[tool.poetry]
name = "acme-worker"
version = "0.2.0"
description = "Example poetry-managed worker"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
celery = { version = "~5.3", extras = ["redis"] }
internal-lib = { git = "https://github.com/acme/internal-lib.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9"

[tool.poetry.dev-dependencies]
black = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
