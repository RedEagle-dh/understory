    "fastapi>=0.110,<1",
    "Django>=4.2",
    "httpx==0.27.0",
]

[project.optional-dependencies]
cli = ["click>=8.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
