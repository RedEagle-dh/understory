version = 1
requires-python = ">=3.11"

[[package]]
name = "acme-api"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "django" },
    { name = "fastapi" },
    { name = "httpx" },
]

[package.optional-dependencies]
cli = [
    { name = "click" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "django"
version = "4.2.11"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "sqlparse" },
]

[[package]]
name = "fastapi"
version = "0.110.3"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pydantic" },
    { name = "starlette" },
]

[[package]]
name = "httpx"
version = "0.27.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pydantic"
version = "2.7.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.2.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sqlparse"
version = "0.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "starlette"
version = "0.37.2"
source = { registry = "https://pypi.org/simple" }
